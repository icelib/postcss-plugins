packages:
  - apps/*
  - packages/*
  - '!**/test/**'
  - templates/*
minimumReleaseAge: 0
versioning:
  changelog:
    storage: repository
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  lefthook: false
  msgpackr-extract: true
  sharp: true
  vue-demi: true
  workerd: true
overrides:
  prettier@^3: 3.9.10
  typescript: 6.0.3
  vite@^8: 8.3.5
  # VitePress 1.6.4 is incompatible with repoctl's Vite 8 runtime; keep its nested runtime on Vite 7.
  vitepress@1.6.4>vite: 7.3.7
  postcss@^8: 8.5.32
  postcss-selector-parser@^7: 7.1.7
  tinypool@^2: 2.2.0
  brace-expansion@^5: 5.0.12
  cross-spawn@^7: 7.0.6
  esbuild@^0.28: 0.28.2
